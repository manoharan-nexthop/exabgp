# ==============================================================================
# ExaBGP SR-Policy (SAFI 73) Configuration Example
# ==============================================================================
# This example demonstrates how to announce SR-Policy routes using ExaBGP.
#
# SR-Policy enables source-based routing by encoding the path as a list of
# segments (MPLS labels or SRv6 SIDs) that packets should traverse.
#
# References:
#   - RFC 9256: Segment Routing Policy Architecture
#   - RFC 9012: The BGP Tunnel Encapsulation Attribute
#
# Key Concepts:
#   - Color: 32-bit value used to map traffic to policies
#   - Endpoint: Destination prefix (IPv4 or IPv6)
#   - Distinguisher: 32-bit value to differentiate policies with same color/endpoint
#   - Binding SID: Label/SID that represents the entire SR-Policy
#   - Segment List: Ordered list of segments (labels or SIDs) defining the path
# ==============================================================================

neighbor 192.0.2.100 {
	router-id 10.0.0.1;
	local-address 192.0.2.1;
	local-as 65000;
	peer-as 65100;

	# Enable SR-Policy address families
	family {
		ipv4 sr-policy;
		ipv6 sr-policy;
	}

	announce {
		ipv4 {
			# ================================================================
			# Example 1: Basic MPLS SR-Policy with single segment
			# ================================================================
			# Use case: Simple traffic steering to endpoint 10.1.1.1
			# Path: Single hop via MPLS label 16001

			sr-policy distinguisher 0 color 100 endpoint 10.1.1.1 \
				next-hop 192.0.2.1 \
				preference 100 \
				binding-sid mpls 24000 \
				segment-list weight 1 segment type-a mpls 16001;

			# ================================================================
			# Example 2: MPLS SR-Policy with multiple segments (explicit path)
			# ================================================================
			# Use case: Traffic engineering - force traffic through specific nodes
			# Path: 16001 → 16002 → 16003 (3-hop explicit path)

			sr-policy distinguisher 0 color 200 endpoint 10.2.2.2 \
				next-hop 192.0.2.1 \
				preference 100 \
				binding-sid mpls 24001 \
				segment-list weight 1 \
					segment type-a mpls 16001 \
					segment type-a mpls 16002 \
					segment type-a mpls 16003;

			# ================================================================
			# Example 3: SR-Policy with multiple segment lists (ECMP)
			# ================================================================
			# Use case: Load balancing - traffic splits across multiple paths
			# Primary path (weight 10): 16001 → 16002
			# Backup path (weight 5):   17001 → 17002

			sr-policy distinguisher 0 color 300 endpoint 10.3.3.3 \
				next-hop 192.0.2.1 \
				preference 100 \
				priority 10 \
				binding-sid mpls 24002 \
				segment-list weight 10 \
					segment type-a mpls 16001 \
					segment type-a mpls 16002 \
				segment-list weight 5 \
					segment type-a mpls 17001 \
					segment type-a mpls 17002;

			# ================================================================
			# Example 4: SRv6 SR-Policy
			# ================================================================
			# Use case: IPv6 network with SRv6 (no MPLS required)
			# Path: fc00:0:1:: → fc00:0:2::

			sr-policy distinguisher 0 color 400 endpoint 10.4.4.4 \
				next-hop 192.0.2.1 \
				preference 100 \
				srv6-binding-sid fc00:0:100::1 \
				segment-list weight 1 \
					segment type-b srv6 fc00:0:1:: \
					segment type-b srv6 fc00:0:2::;

			# ================================================================
			# Example 5: SRv6 with Endpoint Behavior
			# ================================================================
			# Use case: SRv6 uSID with specific endpoint behavior
			# Endpoint Behavior: behavior=65, lb-length=32, ln-length=0,
			#                   fun-length=16, arg-length=0

			sr-policy distinguisher 0 color 500 endpoint 10.5.5.5 \
				next-hop 192.0.2.1 \
				preference 100 \
				srv6-binding-sid fc00:0:200::1 \
				segment-list weight 1 \
					segment type-b srv6 fc00:0:3:: endpoint-behavior 65 32 0 16 0;

			# ================================================================
			# Example 6: Named SR-Policy with metadata
			# ================================================================
			# Use case: Policy management - human-readable names for policies
			# Includes both policy name and candidate path name

			sr-policy distinguisher 1 color 600 endpoint 10.6.6.6 \
				next-hop 192.0.2.1 \
				preference 100 \
				binding-sid mpls 24003 \
				policy-name "low-latency-path" \
				candidate-path-name "primary-path-via-core" \
				segment-list weight 1 \
					segment type-a mpls 16010 \
					segment type-a mpls 16020 \
					segment type-a mpls 16030;
		}

		ipv6 {
			# ================================================================
			# Example 7: IPv6 SR-Policy with SRv6
			# ================================================================
			# Use case: Native IPv6 endpoint with SRv6 steering
			# Path: 2001:db8:1::1 → 2001:db8:2::1 → 2001:db8:3::1

			sr-policy distinguisher 0 color 100 endpoint 2001:db8::1 \
				next-hop 2001:db8:ffff::1 \
				preference 100 \
				srv6-binding-sid fc00:0:300::1 \
				segment-list weight 1 \
					segment type-b srv6 2001:db8:1::1 \
					segment type-b srv6 2001:db8:2::1 \
					segment type-b srv6 2001:db8:3::1;

			# ================================================================
			# Example 8: IPv6 SR-Policy with ECMP and endpoint behavior
			# ================================================================
			# Use case: Dual-path IPv6 with SRv6 uSID

			sr-policy distinguisher 0 color 200 endpoint 2001:db8::2 \
				next-hop 2001:db8:ffff::1 \
				preference 100 \
				srv6-binding-sid fc00:0:400::1 \
				policy-name "ipv6-dual-path" \
				segment-list weight 1 \
					segment type-b srv6 2001:db8:10::1 endpoint-behavior 65 32 0 16 0 \
				segment-list weight 1 \
					segment type-b srv6 2001:db8:20::1 endpoint-behavior 65 32 0 16 0;
		}
	}
}

# ==============================================================================
# Configuration Notes:
# ==============================================================================
#
# SYNTAX FORMAT:
#   sr-policy distinguisher <N> color <N> endpoint <IP> \
#       next-hop <IP> \
#       preference <N> \
#       [priority <N>] \
#       [binding-sid mpls <label>] \
#       [srv6-binding-sid <IPv6>] \
#       [policy-name "<string>"] \
#       [candidate-path-name "<string>"] \
#       segment-list weight <N> \
#           segment type-a mpls <label> [segment type-a mpls <label> ...] \
#       [segment-list weight <N> ...]
#
# Or for SRv6:
#       segment-list weight <N> \
#           segment type-b srv6 <SID> [endpoint-behavior <args>] \
#           [segment type-b srv6 <SID> ...]
#
# 1. DISTINGUISHER:
#    - Usually 0 unless you need multiple policies with same color/endpoint
#    - Increment when advertising multiple candidate paths
#
# 2. COLOR:
#    - Traffic is mapped to policies using color (typically via BGP communities)
#    - Common practice: use color ranges for different service classes
#      * 100-199: Low latency
#      * 200-299: High bandwidth
#      * 300-399: Best effort
#
# 3. NEXT-HOP:
#    - Must be reachable by the receiving router
#    - Typically the router's interface address or a /32 loopback
#
# 4. PREFERENCE:
#    - Higher value = higher preference
#    - Used when multiple candidate paths exist for same policy
#
# 5. PRIORITY (optional):
#    - Used for path protection scenarios
#    - Lower value = higher priority
#
# 6. BINDING-SID vs SRV6-BINDING-SID:
#    - binding-sid mpls: MPLS label (20-1048575)
#    - srv6-binding-sid: IPv6 address
#
# 7. SEGMENT TYPES:
#    - type-a mpls: MPLS label segments
#      Each segment must be declared separately: segment type-a mpls <label>
#    - type-b srv6: SRv6 SID segments with optional endpoint behavior
#      Each segment must be declared separately: segment type-b srv6 <SID>
#
# 8. WEIGHT:
#    - Relative weight for load balancing across segment lists
#    - Traffic distribution proportional to weight values
#
# 9. ENDPOINT BEHAVIOR (SRv6):
#    Format: endpoint-behavior <behavior> <lb-len> <ln-len> <fun-len> <arg-len>
#    - behavior: Endpoint behavior code (e.g., 65 = uSID)
#    - lb-length: Locator Block length in bits
#    - ln-length: Locator Node length in bits
#    - fun-length: Function length in bits
#    - arg-length: Argument length in bits
#
# 10. LINE CONTINUATION:
#    Use backslash (\) at end of line to continue on next line
#
# ==============================================================================
# Running ExaBGP with this configuration:
# ==============================================================================
#
#   exabgp conf-sr-policy.conf
#
# Or with environment variables:
#
#   env exabgp_daemon_daemonize=false \
#       exabgp_log_enable=true \
#       exabgp_log_level=INFO \
#       exabgp conf-sr-policy.conf
#
# ==============================================================================
